[package]
name = "iec104-tls"
version = "0.36.0"
edition = "2024"
rust-version = "1.88"
description = "TLS transport for the iec104 crate: mutual TLS over rustls, after the IEC 62351-3 profile as secondary sources describe it"
license = "Apache-2.0"
repository = "https://github.com/Project-Stateful-Zenith/zenith-iec104"
authors = ["Project-Stateful-Zenith Contributors"]
readme = "../README.md"
homepage = "https://github.com/Project-Stateful-Zenith/zenith-iec104"
keywords = ["iec104", "scada", "tls", "rustls", "iec-60870-5-104"]
categories = ["network-programming", "cryptography"]

[features]
default = []
# Async streams over tokio-rustls, and a connector and accept loops for iec104-tokio.
tokio = ["dep:tokio", "dep:tokio-rustls", "dep:iec104-tokio"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
iec104-tokio = { path = "../iec104-tokio", optional = true }
tokio = { version = "1.53", features = ["macros", "net", "rt", "sync", "time"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }

[dev-dependencies]
iec104 = { path = ".." }
# The tests and examples cover the tokio feature too, under a plain `cargo test`.
iec104-tls = { path = ".", features = ["tokio"] }
iec104-tokio = { path = "../iec104-tokio" }
rcgen = "0.14"
# Small socket buffers, so the tests can stall a TLS write on purpose.
socket2 = "0.6"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
